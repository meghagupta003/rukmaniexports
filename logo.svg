<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 443 207" width="1772" height="828">
  <defs>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5468"/>
      <stop offset="45%" stop-color="#D2001C"/>
      <stop offset="100%" stop-color="#8C0000"/>
    </linearGradient>
    <linearGradient id="brassGrad1" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#F5B04C"/>
      <stop offset="100%" stop-color="#C67F0E"/>
    </linearGradient>
    <linearGradient id="brassGrad2" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#EDA33E"/>
      <stop offset="100%" stop-color="#B87200"/>
    </linearGradient>
    <linearGradient id="brassGrad3" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#E4962F"/>
      <stop offset="100%" stop-color="#A66700"/>
    </linearGradient>
    <radialGradient id="highlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ GEM (marquise / navette cut) ============ -->
  <g>
    <path d="M122,7 Q149,12 161,33 Q149,52 122,57 Q95,52 83,33 Q95,12 122,7 Z" fill="url(#rubyGrad)"/>
    <!-- facet lines -->
    <path d="M122,7 L122,57 M83,33 L161,33 M122,7 L104,33 M122,7 L140,33 M122,57 L104,33 M122,57 L140,33"
          stroke="#6B0000" stroke-width="0.7" opacity="0.45" fill="none"/>
    <!-- specular highlight -->
    <ellipse cx="104" cy="20" rx="14" ry="8" fill="url(#highlight)" transform="rotate(-25 104 20)"/>
  </g>

  <!-- ============ BLACK "R" MONOGRAM ============ -->
  <g fill="#151515">
    <!-- peaked roof / chevron with hollow triangular gap -->
    <path d="M35,120 L69,64 L103,120 L85,120 L69,92 L53,120 Z"/>
    <!-- left stem -->
    <path d="M37,120 L63,120 L63,196 L37,196 Z"/>
    <!-- diagonal kick leg -->
    <path d="M77,120 L103,120 L112,145 L86,196 L60,196 L82,150 Z"/>
  </g>

  <!-- ============ ORANGE / GOLD "E" (staggered facet bars) ============ -->
  <g>
    <path d="M97,64 L184,64 L184,86 L119,86 Z" fill="url(#brassGrad1)"/>
    <path d="M97,100 L165,100 L165,122 L119,122 Z" fill="url(#brassGrad2)"/>
    <path d="M97,136 L146,136 L146,158 L119,158 Z" fill="url(#brassGrad3)"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="221" y="128" font-size="44" letter-spacing="1">RUKMANI</text>
    <text x="221" y="176" font-size="44" letter-spacing="1">EXPORTS</text>
  </g>
</svg>
